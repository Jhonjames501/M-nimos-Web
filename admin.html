<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Cocina y Caja - El Cártel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-light">

    <!-- Audio para Alerta de Pedido Nuevo -->
    <audio id="audioAlerta" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

    <div class="container my-4">
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
            <div>
                <h3 class="fw-bold m-0">👨‍🍳 Panel de Caja / Cocina</h3>
                <p class="text-muted m-0">El Cártel del Buen Sabor</p>
            </div>
            <div class="d-flex gap-2">
                <button class="btn btn-outline-danger btn-sm" onclick="borrarHistorial()">Limpiar Historial</button>
                <button class="btn btn-outline-secondary btn-sm" data-bs-toggle="modal" data-bs-target="#modalAgotados">Gestionar Agotados</button>
            </div>
        </div>

        <!-- Resumen de Ventas del Día -->
        <div class="row mb-4">
            <div class="col-md-6 mb-2">
                <div class="card bg-white shadow-sm border-0 p-3">
                    <span class="text-muted">Pedidos Totales Hoy</span>
                    <h3 class="fw-bold text-primary m-0" id="total-pedidos-hoy">0</h3>
                </div>
            </div>
            <div class="col-md-6 mb-2">
                <div class="card bg-white shadow-sm border-0 p-3">
                    <span class="text-muted">Venta Total Estimada</span>
                    <h3 class="fw-bold text-success m-0" id="total-ventas-hoy">S/ 0.00</h3>
                </div>
            </div>
        </div>

        <!-- Contenedor de Pedidos -->
        <h4 class="mb-3">Pedidos en Curso</h4>
        <div class="row" id="contenedor-pedidos">
            <div class="col-12 text-center text-muted py-5">
                <h5>No hay pedidos pendientes en este momento...</h5>
            </div>
        </div>
    </div>

    <!-- Modal para Gestionar Productos Agotados -->
    <div class="modal fade" id="modalAgotados" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Marcar Platos Agotados</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p class="text-muted small">Selecciona los platos que ya no tienen stock para ocultarlos automáticamente de la carta del cliente.</p>
                    <div id="lista-gestion-agotados" style="max-height: 300px; overflow-y: auto;" class="list-group"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary btn-sm" data-bs-dismiss="modal">Guardar Cambios</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Lista completa de productos sincronizada con la carta
        const productosBase = [
            { id: 1, nombre: "Clásica (Carne)" }, { id: 2, nombre: "Cheese Burguer" }, { id: 3, nombre: "Royal Burguer" }, { id: 4, nombre: "Bacon Cheese Burger" }, { id: 5, nombre: "Mix Burguer" }, { id: 6, nombre: "Super Mix Burguer" },
            { id: 7, nombre: "Deshilachado Clásico" }, { id: 8, nombre: "Cheese Chicken" }, { id: 9, nombre: "Royal Chicken" }, { id: 10, nombre: "Bacon Cheese Chicken" }, { id: 11, nombre: "Mix Chicken" }, { id: 12, nombre: "Super Mix Chicken" },
            { id: 13, nombre: "Chorizo Clásico" }, { id: 14, nombre: "Cheese Chorizo" }, { id: 15, nombre: "Royal Chorizo" }, { id: 16, nombre: "Bacon Cheese Chorizo" },
            { id: 17, nombre: "Alita Broaster" }, { id: 18, nombre: "Pierna o Encuentro" }, { id: 19, nombre: "Pecho Broaster" }, { id: 20, nombre: "Porción de Alitas (4 pzs)" }, { id: 21, nombre: "1/4 de Pollo" }, { id: 22, nombre: "1/2 de Pollo" }, { id: 23, nombre: "1 Pollo Entero" },
            { id: 24, nombre: "Salchipapa Clásica" }, { id: 25, nombre: "Clásica de Huevo" }, { id: 26, nombre: "Salchi Chicken" }, { id: 27, nombre: "Salchi Burger" }, { id: 28, nombre: "Salchi Especial" }, { id: 29, nombre: "Super Salchi Especial" },
            { id: 30, nombre: "Enchilada Hot Dog" }, { id: 31, nombre: "Enchilada Carne" }, { id: 32, nombre: "Enchilada Pollo" }, { id: 33, nombre: "Enchilada Chorizo" }, { id: 34, nombre: "Enchilada Mixta" }, { id: 35, nombre: "Enchilada Extravaganza" },
            { id: 36, nombre: "Filete Clásico" }, { id: 37, nombre: "Cheese Filete" }, { id: 38, nombre: "Royal Filete" },
            { id: 39, nombre: "Adicional Queso" }, { id: 40, nombre: "Adicional Huevo" }, { id: 41, nombre: "Adicional Tocino" }, { id: 42, nombre: "Adicional Hot Dog" }, { id: 43, nombre: "Adicional Carne" }, { id: 44, nombre: "Adicional Chorizo" }, { id: 45, nombre: "Adicional Filete de Pollo" }, { id: 46, nombre: "Adicional Pollo Deshilachado" },
            { id: 47, nombre: "Inca Kola 1.5 LT" }, { id: 48, nombre: "Coca Cola 1 LT" }, { id: 49, nombre: "Inca Kola Gordita" }, { id: 50, nombre: "Inca Kola 600 ml" }, { id: 51, nombre: "Coca Cola 600 ml" }, { id: 52, nombre: "Agua Personal" }
        ];

        let cantidadPedidosAnterior = 0;

        function cargarAdmin() {
            const pedidos = JSON.parse(localStorage.getItem('pedidos_restaurante')) || [];
            const contenedor = document.getElementById('contenedor-pedidos');
            
            // Alerta sonora si entra un pedido nuevo
            if (pedidos.length > cantidadPedidosAnterior && cantidadPedidosAnterior !== 0) {
                document.getElementById('audioAlerta').play().catch(e => console.log("Audio bloqueado por navegador"));
            }
            cantidadPedidosAnterior = pedidos.length;

            contenedor.innerHTML = '';

            if (pedidos.length === 0) {
                contenedor.innerHTML = `<div class="col-12 text-center text-muted py-5"><h5>No hay pedidos en curso</h5></div>`;
                document.getElementById('total-pedidos-hoy').innerText = "0";
                document.getElementById('total-ventas-hoy').innerText = "S/ 0.00";
                return;
            }

            let totalVentas = 0;
            let totalPedidosCount = pedidos.length;

            pedidos.forEach((pedido) => {
                // Calcular valor numérico para la estadística
                let numTotal = parseFloat(pedido.total.replace('S/', '').trim()) || 0;
                totalVentas += numTotal;

                let estadoClase = 'warning';
                if (pedido.estado === 'En Preparación') estadoClase = 'info';
                if (pedido.estado === 'Listo') estadoClase = 'success';
                if (pedido.estado === 'Entregado') estadoClase = 'secondary';

                let itemsHtml = '';
                pedido.items.forEach(item => {
                    let notaTxt = item.nota ? `<br><small class="text-danger fw-bold">Nota: ${item.nota}</small>` : '';
                    itemsHtml += `<li>${item.cantidad}x ${item.nombre} (S/ ${(item.precio * item.cantidad).toFixed(2)})${notaTxt}</li>`;
                });

                contenedor.innerHTML += `
                    <div class="col-md-4 mb-3">
                        <div class="card shadow-sm border-0 h-100">
                            <div class="card-body d-flex flex-column justify-content-between">
                                <div>
                                    <div class="d-flex justify-content-between align-items-center mb-2">
                                        <h5 class="fw-bold m-0">${pedido.cliente}</h5>
                                        <span class="badge bg-${estadoClase}">${pedido.estado || 'Pendiente'}</span>
                                    </div>
                                    <p class="text-muted small mb-2"><i class="fas fa-wallet"></i> Pago: ${pedido.metodo}</p>
                                    <hr class="my-1">
                                    <ul class="ps-3 mb-3" style="font-size: 0.9rem;">
                                        ${itemsHtml}
                                    </ul>
                                </div>
                                <div>
                                    <div class="d-flex justify-content-between align-items-center mb-2">
                                        <span class="fw-bold">Total:</span>
                                        <span class="fw-bold text-success fs-5">${pedido.total}</span>
                                    </div>
                                    <div class="btn-group w-100 mb-2">
                                        <button class="btn btn-outline-primary btn-sm" onclick="cambiarEstado(${pedido.id}, 'En Preparación')">Preparar</button>
                                        <button class="btn btn-outline-success btn-sm" onclick="cambiarEstado(${pedido.id}, 'Listo')">Listo</button>
                                    </div>
                                    <div class="d-flex gap-1">
                                        <button class="btn btn-success btn-sm w-100" onclick="marcarEntregado(${pedido.id})">Cobrar / Finalizar</button>
                                        <button class="btn btn-outline-secondary btn-sm" onclick="imprimirComanda('${pedido.cliente}', '${pedido.total}')"><i class="fas fa-print"></i></button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });

            document.getElementById('total-pedidos-hoy').innerText = totalPedidosCount;
            document.getElementById('total-ventas-hoy').innerText = `S/ ${totalVentas.toFixed(2)}`;
        }

        function cambiarEstado(id, nuevoEstado) {
            let pedidos = JSON.parse(localStorage.getItem('pedidos_restaurante')) || [];
            pedidos = pedidos.map(p => {
                if (p.id === id) p.estado = nuevoEstado;
                return p;
            });
            localStorage.setItem('pedidos_restaurante', JSON.stringify(pedidos));
            cargarAdmin();
        }

        function marcarEntregado(id) {
            let pedidos = JSON.parse(localStorage.getItem('pedidos_restaurante')) || [];
            // Elimina el pedido completado
            pedidos = pedidos.filter(p => p.id !== id);
            localStorage.setItem('pedidos_restaurante', JSON.stringify(pedidos));
            cargarAdmin();
        }

        function borrarHistorial() {
            if (confirm("¿Seguro que deseas limpiar todos los pedidos del panel?")) {
                localStorage.removeItem('pedidos_restaurante');
                cargarAdmin();
            }
        }

        function imprimirComanda(cliente, total) {
            window.print();
        }

        function cargarListaAgotadosModal() {
            const contenedorAgotados = document.getElementById('lista-gestion-agotados');
            const agotadosActuales = JSON.parse(localStorage.getItem('platos_agotados')) || [];
            contenedorAgotados.innerHTML = '';

            productosBase.forEach(prod => {
                let estaAgotado = agotadosActuales.includes(prod.id);
                contenedorAgotados.innerHTML += `
                    <label class="list-group-item d-flex justify-content-between align-items-center">
                        <span>${prod.nombre}</span>
                        <input class="form-check-input me-1" type="checkbox" ${estaAgotado ? 'checked' : ''} onclick="toggleAgotado(${prod.id})">
                    </label>
                `;
            });
        }

        function toggleAgotado(id) {
            let agotados = JSON.parse(localStorage.getItem('platos_agotados')) || [];
            if (agotados.includes(id)) {
                agotados = agotados.filter(item => item !== id);
            } else {
                agotados.push(id);
            }
            localStorage.setItem('platos_agotados', JSON.stringify(agotados));
        }

        document.getElementById('modalAgotados').addEventListener('show.bs.modal', cargarListaAgotadosModal);

        // Actualizar automáticamente cada 4 segundos para recibir pedidos nuevos
        setInterval(cargarAdmin, 4000);
        cargarAdmin();
    </script>
</body>
</html>
