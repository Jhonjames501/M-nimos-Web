<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Cártel del Buen Sabor - Menú Digital</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome para Iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f4f6f9;
        }
        .header-cartel {
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            color: white;
            border-bottom: 4px solid #ffc107;
        }
        .card-producto {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            border: none;
            border-radius: 12px;
            overflow: hidden;
        }
        .card-producto:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.08);
        }
        .btn-cartel {
            background-color: #ffc107;
            color: #000;
            font-weight: 600;
            border: none;
        }
        .btn-cartel:hover {
            background-color: #e0a800;
            color: #000;
        }
        .badge-categoria {
            font-size: 0.75rem;
            letter-spacing: 0.5px;
        }
        .carrito-card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
    </style>
</head>
<body>

    <!-- Encabezado Estilizado -->
    <header class="header-cartel py-4 mb-4 shadow">
        <div class="container text-center">
            <h1 class="fw-bold mb-1"><i class="fas fa-burger text-warning me-2"></i>EL CÁRTEL</h1>
            <p class="text-warning mb-0 fs-5 fw-light">del buen sabor</p>
            <span class="badge bg-danger mt-2 px-3 py-1 fst-italic">¡Condenados a comer rico!</span>
        </div>
    </header>

    <div class="container mb-5">
        <!-- Filtros por Categoría Modernos -->
        <div class="d-flex overflow-auto pb-3 mb-4 gap-2" id="filtro-categorias" style="white-space: nowrap;">
            <button class="btn btn-dark btn-sm rounded-pill px-3 active shadow-sm" onclick="filtrarCategoria('Todos')"><i class="fas fa-th-large me-1"></i> Ver Todo</button>
        </div>

        <div class="row g-4">
            <!-- Menú de Productos -->
            <div class="col-lg-7">
                <div class="row g-3" id="menu-productos"></div>
            </div>

            <!-- Resumen del Pedido (Carrito) -->
            <div class="col-lg-5">
                <div class="card carrito-card sticky-top bg-white p-3" style="top: 20px;">
                    <div class="card-body">
                        <h4 class="card-title fw-bold mb-3"><i class="fas fa-receipt text-warning me-2"></i>Tu Pedido Actual</h4>
                        
                        <div class="mb-3">
                            <label class="form-label fw-semibold small text-muted"><i class="fas fa-user-tag me-1"></i> Número de Mesa o Nombre:</label>
                            <input type="text" id="nombre-cliente" class="form-control form-control-lg bg-light border-0" placeholder="Ej: Mesa 4 o Juan Pérez">
                        </div>

                        <div class="table-responsive mb-3" style="max-height: 260px; overflow-y: auto;">
                            <table class="table table-sm align-middle">
                                <thead class="table-light">
                                    <tr>
                                        <th class="ps-2">Item</th>
                                        <th>Cant</th>
                                        <th>Subtotal</th>
                                        <th></th>
                                    </tr>
                                </thead>
                                <tbody id="lista-carrito"></tbody>
                            </table>
                        </div>

                        <div class="bg-light p-3 rounded-3 mb-3">
                            <div class="d-flex justify-content-between align-items-center">
                                <span class="fw-bold fs-5">Total a Pagar:</span>
                                <span id="total-pagar" class="text-success fw-bold fs-4">S/ 0.00</span>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold small text-muted"><i class="fas fa-wallet me-1"></i> Método de Pago:</label>
                            <select id="metodo-pago" class="form-select bg-light border-0">
                                <option value="Efectivo al recibir">💵 Efectivo al recibir</option>
                                <option value="Yape / Plin">📱 Yape / Plin (BCP)</option>
                                <option value="Tarjeta POS">💳 Tarjeta POS</option>
                            </select>
                        </div>

                        <div class="d-grid">
                            <button class="btn btn-cartel btn-lg py-3 shadow-sm fw-bold" onclick="enviarPedido()">
                                <i class="fas fa-paper-plane me-2"></i> Enviar Pedido a Caja
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal para Agregar Cremas y Notas -->
    <div class="modal fade" id="modalNota" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg rounded-4">
                <div class="modal-header bg-dark text-white rounded-top-4">
                    <h5 class="modal-title fw-bold" id="titulo-modal-producto">Personalizar Pedido</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4">
                    <input type="hidden" id="modal-producto-id">
                    
                    <label class="form-label fw-bold text-dark mb-3"><i class="fas fa-bottle-droplet text-warning me-1"></i> Elige tus Cremas:</label>
                    <div class="row g-2 mb-4" id="lista-cremas-checkbox">
                        <div class="col-6"><div class="form-check p-2 bg-light rounded"><input class="form-check-input crema-opcion ms-1" type="checkbox" value="Mayonesa" id="crema1"><label class="form-check-label ms-2 fw-medium" for="crema1">Mayonesa</label></div></div>
                        <div class="col-6"><div class="form-check p-2 bg-light rounded"><input class="form-check-input crema-opcion ms-1" type="checkbox" value="Ketchup" id="crema2"><label class="form-check-label ms-2 fw-medium" for="crema2">Ketchup</label></div></div>
                        <div class="col-6"><div class="form-check p-2 bg-light rounded"><input class="form-check-input crema-opcion ms-1" type="checkbox" value="Mostaza" id="crema3"><label class="form-check-label ms-2 fw-medium" for="crema3">Mostaza</label></div></div>
                        <div class="col-6"><div class="form-check p-2 bg-light rounded"><input class="form-check-input crema-opcion ms-1" type="checkbox" value="Aji" id="crema4"><label class="form-check-label ms-2 fw-medium" for="crema4">Ají</label></div></div>
                        <div class="col-6"><div class="form-check p-2 bg-light rounded"><input class="form-check-input crema-opcion ms-1" type="checkbox" value="Tartara" id="crema5"><label class="form-check-label ms-2 fw-medium" for="crema5">Tártara</label></div></div>
                        <div class="col-6"><div class="form-check p-2 bg-light rounded"><input class="form-check-input crema-opcion ms-1" type="checkbox" value="Golf" id="crema6"><label class="form-check-label ms-2 fw-medium" for="crema6">Golf</label></div></div>
                        <div class="col-12"><div class="form-check p-2 bg-light rounded"><input class="form-check-input crema-opcion ms-1" type="checkbox" value="Aceituna" id="crema7"><label class="form-check-label ms-2 fw-medium" for="crema7">Aceituna</label></div></div>
                    </div>

                    <div class="mb-2">
                        <label class="form-label fw-bold text-dark"><i class="fas fa-comment-alt text-warning me-1"></i> Nota adicional (Opcional):</label>
                        <input type="text" id="nota-producto" class="form-control bg-light border-0" placeholder="Ej: Sin cebolla, papas crocantes">
                    </div>
                </div>
                <div class="modal-footer border-0 p-4 pt-0">
                    <button type="button" class="btn btn-outline-secondary px-4 rounded-pill" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-cartel px-4 rounded-pill fw-bold" onclick="confirmarAgregarConNota()">Agregar al Pedido</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const productos = [
            { id: 1, categoria: "Hamburguesas de Carne", nombre: "Clásica (Carne)", precio: 10.00 },
            { id: 2, categoria: "Hamburguesas de Carne", nombre: "Cheese Burguer", precio: 11.50 },
            { id: 3, categoria: "Hamburguesas de Carne", nombre: "Royal Burguer", precio: 13.00 },
            { id: 4, categoria: "Hamburguesas de Carne", nombre: "Bacon Cheese Burger", precio: 17.00 },
            { id: 5, categoria: "Hamburguesas de Carne", nombre: "Mix Burguer", precio: 19.00 },
            { id: 6, categoria: "Hamburguesas de Carne", nombre: "Super Mix Burguer", precio: 21.00 },

            { id: 7, categoria: "Hamburguesas de Pollo", nombre: "Deshilachado Clásico", precio: 10.00 },
            { id: 8, categoria: "Hamburguesas de Pollo", nombre: "Cheese Chicken", precio: 11.50 },
            { id: 9, categoria: "Hamburguesas de Pollo", nombre: "Royal Chicken", precio: 13.00 },
            { id: 10, categoria: "Hamburguesas de Pollo", nombre: "Bacon Cheese Chicken", precio: 17.00 },
            { id: 11, categoria: "Hamburguesas de Pollo", nombre: "Mix Chicken", precio: 19.00 },
            { id: 12, categoria: "Hamburguesas de Pollo", nombre: "Super Mix Chicken", precio: 21.00 },

            { id: 13, categoria: "Hamburguesas de Chorizo", nombre: "Chorizo Clásico", precio: 12.00 },
            { id: 14, categoria: "Hamburguesas de Chorizo", nombre: "Cheese Chorizo", precio: 12.50 },
            { id: 15, categoria: "Hamburguesas de Chorizo", nombre: "Royal Chorizo", precio: 14.00 },
            { id: 16, categoria: "Hamburguesas de Chorizo", nombre: "Bacon Cheese Chorizo", precio: 17.00 },

            { id: 17, categoria: "Broaster", nombre: "Alita Broaster", precio: 11.00 },
            { id: 18, categoria: "Broaster", nombre: "Pierna o Encuentro", precio: 12.00 },
            { id: 19, categoria: "Broaster", nombre: "Pecho Broaster", precio: 14.00 },
            { id: 20, categoria: "Broaster", nombre: "Porción de Alitas (4 pzs)", precio: 12.00 },
            { id: 21, categoria: "Broaster", nombre: "1/4 de Pollo", precio: 21.00 },
            { id: 22, categoria: "Broaster", nombre: "1/2 de Pollo", precio: 40.00 },
            { id: 23, categoria: "Broaster", nombre: "1 Pollo Entero", precio: 76.00 },

            { id: 24, categoria: "Salchipapas", nombre: "Salchipapa Clásica", precio: 11.00 },
            { id: 25, categoria: "Salchipapas", nombre: "Clásica de Huevo", precio: 12.50 },
            { id: 26, categoria: "Salchipapas", nombre: "Salchi Chicken", precio: 16.00 },
            { id: 27, categoria: "Salchipapas", nombre: "Salchi Burger", precio: 15.00 },
            { id: 28, categoria: "Salchipapas", nombre: "Salchi Especial", precio: 19.00 },
            { id: 29, categoria: "Salchipapas", nombre: "Super Salchi Especial", precio: 20.00 },

            { id: 30, categoria: "Enchiladas", nombre: "Enchilada Hot Dog", precio: 13.00 },
            { id: 31, categoria: "Enchiladas", nombre: "Enchilada Carne", precio: 14.00 },
            { id: 32, categoria: "Enchiladas", nombre: "Enchilada Pollo", precio: 15.00 },
            { id: 33, categoria: "Enchiladas", nombre: "Enchilada Chorizo", precio: 15.00 },
            { id: 34, categoria: "Enchiladas", nombre: "Enchilada Mixta", precio: 17.00 },
            { id: 35, categoria: "Enchiladas", nombre: "Enchilada Extravaganza", precio: 20.00 },

            { id: 36, categoria: "Filete de Pechuga", nombre: "Filete Clásico", precio: 12.00 },
            { id: 37, categoria: "Filete de Pechuga", nombre: "Cheese Filete", precio: 13.00 },
            { id: 38, categoria: "Filete de Pechuga", nombre: "Royal Filete", precio: 15.00 },

            { id: 39, categoria: "Adicionales", nombre: "Adicional Queso", precio: 2.00 },
            { id: 40, categoria: "Adicionales", nombre: "Adicional Huevo", precio: 2.00 },
            { id: 41, categoria: "Adicionales", nombre: "Adicional Tocino", precio: 5.00 },
            { id: 42, categoria: "Adicionales", nombre: "Adicional Hot Dog", precio: 6.00 },
            { id: 43, categoria: "Adicionales", nombre: "Adicional Carne", precio: 5.00 },
            { id: 44, categoria: "Adicionales", nombre: "Adicional Chorizo", precio: 5.00 },
            { id: 45, categoria: "Adicionales", nombre: "Adicional Filete de Pollo", precio: 6.00 },
            { id: 46, categoria: "Adicionales", nombre: "Adicional Pollo Deshilachado", precio: 5.00 },

            { id: 47, categoria: "Bebidas", nombre: "Inca Kola 1.5 LT", precio: 8.50 },
            { id: 48, categoria: "Bebidas", nombre: "Coca Cola 1 LT", precio: 8.50 },
            { id: 49, categoria: "Bebidas", nombre: "Inca Kola Gordita", precio: 5.00 },
            { id: 50, categoria: "Bebidas", nombre: "Inca Kola 600 ml", precio: 4.00 },
            { id: 51, categoria: "Bebidas", nombre: "Coca Cola 600 ml", precio: 4.00 },
            { id: 52, categoria: "Bebidas", nombre: "Agua Personal", precio: 2.00 }
        ];

        let carrito = [];
        let categoriaActual = 'Todos';

        function inicializarFiltros() {
            const contenedorFiltros = document.getElementById('filtro-categorias');
            const categorias = ['Todos', ...new Set(productos.map(p => p.categoria))];
            
            categorias.forEach(cat => {
                if(cat !== 'Todos') {
                    contenedorFiltros.innerHTML += `<button class="btn btn-outline-dark btn-sm rounded-pill px-3 shadow-sm" onclick="filtrarCategoria('${cat}')">${cat}</button>`;
                }
            });
        }

        function filtrarCategoria(cat) {
            categoriaActual = cat;
            const botones = document.querySelectorAll('#filtro-categorias button');
            botones.forEach(btn => {
                if(btn.innerText.includes(cat) || (cat === 'Todos' && btn.innerText.includes('Ver Todo'))) {
                    btn.className = "btn btn-dark btn-sm rounded-pill px-3 active shadow-sm";
                } else {
                    btn.className = "btn btn-outline-dark btn-sm rounded-pill px-3 shadow-sm";
                }
            });
            cargarMenu();
        }

        function cargarMenu() {
            const contenedor = document.getElementById('menu-productos');
            contenedor.innerHTML = '';

            const agotados = JSON.parse(localStorage.getItem('platos_agotados')) || [];
            const prodsFiltrados = categoriaActual === 'Todos' 
                ? productos 
                : productos.filter(p => p.categoria === categoriaActual);

            prodsFiltrados.forEach(prod => {
                if (agotados.includes(prod.id)) return;

                contenedor.innerHTML += `
                    <div class="col-sm-6">
                        <div class="card card-producto h-100 bg-white p-2">
                            <div class="card-body d-flex flex-column justify-content-between p-3">
                                <div>
                                    <span class="badge bg-light text-muted border mb-2 badge-categoria rounded-pill px-2 py-1">${prod.categoria}</span>
                                    <h6 class="card-title fw-bold text-dark mb-1">${prod.nombre}</h6>
                                    <p class="text-success fw-bold fs-5 mb-3">S/ ${prod.precio.toFixed(2)}</p>
                                </div>
                                <button class="btn btn-outline-dark btn-sm w-100 rounded-pill py-2 fw-semibold" onclick="abrirModalNota(${prod.id})">
                                    <i class="fas fa-plus-circle me-1"></i> Agregar
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function abrirModalNota(id) {
            const prod = productos.find(p => p.id === id);
            document.getElementById('modal-producto-id').value = id;
            document.getElementById('titulo-modal-producto').innerText = `Personalizar: ${prod.nombre}`;
            document.getElementById('nota-producto').value = '';
            
            document.querySelectorAll('.crema-opcion').forEach(el => el.checked = false);

            const modal = new bootstrap.Modal(document.getElementById('modalNota'));
            modal.show();
        }

        function confirmarAgregarConNota() {
            const id = parseInt(document.getElementById('modal-producto-id').value);
            const notaPersonalizada = document.getElementById('nota-producto').value.trim();
            const producto = productos.find(p => p.id === id);

            let cremasSeleccionadas = [];
            document.querySelectorAll('.crema-opcion:checked').forEach(el => {
                cremasSeleccionadas.push(el.value);
            });

            let textoDetalle = "";
            if (cremasSeleccionadas.length > 0) {
                textoDetalle += `Cremas: ${cremasSeleccionadas.join(', ')}`;
            }
            if (notaPersonalizada) {
                textoDetalle += (textoDetalle ? " | " : "") + `Nota: ${notaPersonalizada}`;
            }

            const itemUnicoId = `${id}-${textoDetalle}`;
            const itemEnCarrito = carrito.find(item => item.itemUnicoId === itemUnicoId);

            if (itemEnCarrito) {
                itemEnCarrito.cantidad++;
            } else {
                carrito.push({
                    itemUnicoId: itemUnicoId,
                    id: producto.id,
                    nombre: producto.nombre,
                    precio: producto.precio,
                    cantidad: 1,
                    detalles: textoDetalle
                });
            }

            const modalEl = document.getElementById('modalNota');
            const modal = bootstrap.Modal.getInstance(modalEl);
            modal.hide();

            actualizarCarrito();
        }

        function cambiarCantidad(itemUnicoId, cambio) {
            const item = carrito.find(p => p.itemUnicoId === itemUnicoId);
            if (item) {
                item.cantidad += cambio;
                if (item.cantidad <= 0) {
                    carrito = carrito.filter(p => p.itemUnicoId !== itemUnicoId);
                }
            }
            actualizarCarrito();
        }

        function actualizarCarrito() {
            const tbody = document.getElementById('lista-carrito');
            const spanTotal = document.getElementById('total-pagar');
            tbody.innerHTML = '';
            let total = 0;

            if (carrito.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="text-center text-muted py-4">Aún no hay productos seleccionados</td></tr>`;
                spanTotal.innerText = `S/ 0.00`;
                return;
            }

            carrito.forEach(item => {
                let subtotal = item.precio * item.cantidad;
                total += subtotal;
                let textoDetallesHtml = item.detalles ? `<br><small class="text-danger fw-semibold">👉 ${item.detalles}</small>` : '';
                
                tbody.innerHTML += `
                    <tr>
                        <td class="ps-2" style="font-size: 0.85rem;">${item.nombre} ${textoDetallesHtml}</td>
                        <td style="white-space: nowrap;">
                            <button class="btn btn-sm btn-outline-dark py-0 px-1 rounded-circle" onclick="cambiarCantidad('${item.itemUnicoId}', -1)">-</button>
                            <span class="mx-1 fw-bold">${item.cantidad}</span>
                            <button class="btn btn-sm btn-outline-dark py-0 px-1 rounded-circle" onclick="cambiarCantidad('${item.itemUnicoId}', 1)">+</button>
                        </td>
                        <td style="font-size: 0.85rem;" class="fw-semibold">S/ ${subtotal.toFixed(2)}</td>
                        <td><button class="btn btn-outline-danger btn-sm py-0 px-1 border-0" onclick="cambiarCantidad('${item.itemUnicoId}', -${item.cantidad})"><i class="fas fa-trash-alt"></i></button></td>
                    </tr>
                `;
            });
            spanTotal.innerText = `S/ ${total.toFixed(2)}`;
        }

        function enviarPedido() {
            if (carrito.length === 0) {
                alert("Agrega al menos un producto a tu pedido.");
                return;
            }
            const cliente = document.getElementById('nombre-cliente').value.trim();
            if (!cliente) {
                alert("Por favor ingresa tu número de mesa o nombre.");
                return;
            }

            const nuevoPedido = {
                id: Date.now(),
                cliente: cliente,
                items: [...carrito],
                total: document.getElementById('total-pagar').innerText,
                metodo: document.getElementById('metodo-pago').value,
                estado: "Pendiente"
            };

            let pedidos = JSON.parse(localStorage.getItem('pedidos_restaurante')) || [];
            pedidos.push(nuevoPedido);
            localStorage.setItem('pedidos_restaurante', JSON.stringify(pedidos));

            alert("¡Pedido enviado con éxito a la cocina de El Cártel!");
            carrito = [];
            document.getElementById('nombre-cliente').value = '';
            actualizarCarrito();
        }

        inicializarFiltros();
        actualizarCarrito();
        cargarMenu();
    </script>
</body>
</html>
