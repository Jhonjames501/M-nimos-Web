<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema POS Básico</title>
    <!-- Bootstrap CSS para el diseño -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-4">
        <h2 class="mb-4">💻 Mini Sistema POS - Ventas</h2>
        
        <div class="row">
            <!-- Sección de Productos -->
            <div class="col-md-7">
                <h4>Productos Disponibles</h4>
                <div class="row">
                    <div class="col-md-4 mb-3">
                        <div class="card p-3 text-center">
                            <h5 class="card-title">Pollo a la Brasa</h5>
                            <p class="text-muted">S/ 65.00</p>
                            <button class="btn btn-primary btn-sm" onclick="agregarProducto('Pollo a la Brasa', 65.00)">Agregar</button>
                        </div>
                    </div>
                    <div class="col-md-4 mb-3">
                        <div class="card p-3 text-center">
                            <h5 class="card-title">Gaseosa 1.5L</h5>
                            <p class="text-muted">S/ 10.00</p>
                            <button class="btn btn-primary btn-sm" onclick="agregarProducto('Gaseosa 1.5L', 10.00)">Agregar</button>
                        </div>
                    </div>
                    <div class="col-md-4 mb-3">
                        <div class="card p-3 text-center">
                            <h5 class="card-title">Porción Papas</h5>
                            <p class="text-muted">S/ 15.00</p>
                            <button class="btn btn-primary btn-sm" onclick="agregarProducto('Porción Papas', 15.00)">Agregar</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Sección del Carrito / Venta -->
            <div class="col-md-5">
                <div class="card p-3">
                    <h4>Venta Actual</h4>
                    <ul id="lista-carrito" class="list-group mb-3">
                        <!-- Los productos agregados aparecerán aquí -->
                    </ul>
                    <h5>Total a Pagar: <span id="total">S/ 0.00</span></h5>
                    
                    <div class="mb-3">
                        <label class="form-label">Método de Pago:</label>
                        <select id="metodo-pago" class="form-select">
                            <option value="Efectivo">Efectivo</option>
                            <option value="Yape">Yape / Plin</option>
                            <option value="Visa">Tarjeta Visa</option>
                        </select>
                    </div>

                    <button class="btn btn-success w-100" onclick="procesarVenta()">Cobrar e Imprimir</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Script de lógica en JavaScript -->
    <script>
        let carrito = [];
        let total = 0;

        function agregarProducto(nombre, precio) {
            carrito.push({ nombre, precio });
            actualizarCarrito();
        }

        function actualizarCarrito() {
            const lista = document.getElementById('lista-carrito');
            lista.innerHTML = '';
            total = 0;

            carrito.forEach((item, index) => {
                total += item.precio;
                lista.innerHTML += `
                    <li class="list-group-item d-flex justify-content-between align-items-center">
                        ${item.nombre} - S/ ${item.precio.toFixed(2)}
                        <button class="btn btn-danger btn-sm" onclick="eliminarItem(${index})">X</button>
                    </li>
                `;
            });

            document.getElementById('total').innerText = `S/ ${total.toFixed(2)}`;
        }

        function eliminarItem(index) {
            carrito.splice(index, 1);
            actualizarCarrito();
        }

        function procesarVenta() {
            if (carrito.length === 0) {
                alert("El carrito está vacío.");
                return;
            }
            const metodo = document.getElementById('metodo-pago').value;
            alert(`¡Venta procesada con éxito!\nTotal: S/ ${total.toFixed(2)}\nMétodo: ${metodo}\n(Imprimiendo ticket y abriendo gaveta...)`);
            carrito = [];
            actualizarCarrito();
        }
    </script>
</body>
</html>
