<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema POS - Restaurante</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container my-4">
        <h2 class="text-center mb-4">🖥️ Sistema POS - Restaurante</h2>

        <div class="row">
            <!-- Productos Disponibles -->
            <div class="col-md-7 mb-4">
                <h4 class="mb-3">Menú Disponible</h4>
                <div class="row" id="menu-productos">
                    <!-- Los productos se cargan aquí -->
                </div>
            </div>

            <!-- Venta Actual / Ticket -->
            <div class="col-md-5">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h4 class="card-title mb-3">Venta Actual</h4>
                        
                        <div class="table-responsive" style="max-height: 250px; overflow-y: auto;">
                            <table class="table table-sm">
                                <thead>
                                    <tr>
                                        <th>Item</th>
                                        <th>Cant</th>
                                        <th>Subtotal</th>
                                        <th></th>
                                    </tr>
                                </thead>
                                <tbody id="lista-carrito">
                                    <!-- Aquí van los productos agregados -->
                                </tbody>
                            </table>
                        </div>

                        <hr>
                        <h5>Total a Pagar: <span id="total-pagar" class="text-success fw-bold">S/ 0.00</span></h5>

                        <div class="mb-3 mt-3">
                            <label for="metodo-pago" class="form-label">Método de Pago:</label>
                            <select id="metodo-pago" class="form-select">
                                <option value="Efectivo">Efectivo</option>
                                <option value="Yape / Plin">Yape / Plin</option>
                                <option value="Tarjeta POS">Tarjeta POS</option>
                            </select>
                        </div>

                        <div class="d-grid gap-2">
                            <button class="btn btn-success" onclick="procesarCobro()">Cobrar e Imprimir Ticket</button>
                            <button class="btn btn-outline-danger btn-sm" onclick="limpiarCarrito()">Cancelar Venta</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Script de lógica POS -->
    <script>
        const productos = [
            { id: 1, nombre: "Pollo a la Brasa", precio: 65.00 },
            { id: 2, nombre: "Gaseosa 1.5L", precio: 10.00 },
            { id: 3, nombre: "Porción Papas", precio: 15.00 },
            { id: 4, nombre: "Chifa Aero", precio: 22.00 },
            { id: 5, nombre: "Lomo Saltado", precio: 28.00 }
        ];

        let carrito = [];

        function cargarMenu() {
            const contenedor = document.getElementById('menu-productos');
            contenedor.innerHTML = '';
            productos.forEach(prod => {
                contenedor.innerHTML += `
                    <div class="col-sm-6 mb-3">
                        <div class="card h-100 shadow-sm">
                            <div class="card-body d-flex flex-column justify-content-between">
                                <div>
                                    <h5 class="card-title fs-6">${prod.nombre}</h5>
                                    <p class="card-text text-muted fw-bold">S/ ${prod.precio.toFixed(2)}</p>
                                </div>
                                <button class="btn btn-primary btn-sm mt-2" onclick="agregarAlCarrito(${prod.id})">Agregar</button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function agregarAlCarrito(id) {
            const producto = productos.find(p => p.id === id);
            const itemEnCarrito = carrito.find(item => item.id === id);

            if (itemEnCarrito) {
                itemEnCarrito.cantidad++;
            } else {
                carrito.push({ ...producto, cantidad: 1 });
            }
            actualizarCarrito();
        }

        function cambiarCantidad(id, cambio) {
            const item = carrito.find(p => p.id === id);
            if (item) {
                item.cantidad += cambio;
                if (item.cantidad <= 0) {
                    carrito = carrito.filter(p => p.id !== id);
                }
            }
            actualizarCarrito();
        }

        function actualizarCarrito() {
            const tbody = document.getElementById('lista-carrito');
            const spanTotal = document.getElementById('total-pagar');
            tbody.innerHTML = '';
            let total = 0;

            carrito.forEach(item => {
                let subtotal = item.precio * item.cantidad;
                total += subtotal;
                tbody.innerHTML += `
                    <tr>
                        <td>${item.nombre}</td>
                        <td>
                            <button class="btn btn-xs btn-outline-secondary py-0 px-1" onclick="cambiarCantidad(${item.id}, -1)">-</button>
                            ${item.cantidad}
                            <button class="btn btn-xs btn-outline-secondary py-0 px-1" onclick="cambiarCantidad(${item.id}, 1)">+</button>
                        </td>
                        <td>S/ ${subtotal.toFixed(2)}</td>
                        <td><button class="btn btn-danger btn-sm py-0 px-1" onclick="cambiarCantidad(${item.id}, -${item.cantidad})">&times;</button></td>
                    </tr>
                `;
            });

            spanTotal.innerText = `S/ ${total.toFixed(2)}`;
        }

        function limpiarCarrito() {
            carrito = [];
            actualizarCarrito();
        }

        function procesarCobro() {
            if (carrito.length === 0) {
                alert("No hay productos en la venta actual.");
                return;
            }
            const metodo = document.getElementById('metodo-pago').value;
            const total = document.getElementById('total-pagar').innerText;
            alert(`¡Cobro exitoso!\nMétodo: ${metodo}\nTotal: ${total}\n\nImprimiendo ticket de venta...`);
            limpiarCarrito();
        }

        // Inicializar menú al cargar
        cargarMenu();
    </script>
</body>
</html>
