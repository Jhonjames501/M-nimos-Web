<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Cártel del Buen Sabor - Pedidos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container my-4">
        <div class="text-center mb-4">
            <h2 class="fw-bold">🍔 EL CÁRTEL <span class="text-muted fs-5">del buen sabor</span></h2>
            <p class="text-danger fst-italic">¡Condenados a comer rico!</p>
        </div>

        <div class="row">
            <!-- Menú por categorías -->
            <div class="col-lg-7 mb-4">
                <h4 class="mb-3">Nuestra Carta</h4>
                <div class="row" id="menu-productos"></div>
            </div>

            <!-- Resumen del pedido -->
            <div class="col-lg-5">
                <div class="card shadow-sm sticky-top" style="top: 20px;">
                    <div class="card-body">
                        <h4 class="card-title mb-3">Tu Pedido Actual</h4>
                        
                        <div class="mb-3">
                            <label class="form-label fw-bold">Número de Mesa o Nombre:</label>
                            <input type="text" id="nombre-cliente" class="form-control" placeholder="Ej: Mesa 4 o Juan Pérez">
                        </div>

                        <div class="table-responsive" style="max-height: 250px; overflow-y: auto;">
                            <table class="table table-sm align-middle">
                                <thead>
                                    <tr>
                                        <th>Item</th>
                                        <th>Cant</th>
                                        <th>Subtotal</th>
                                        <th></th>
                                    </tr>
                                </thead>
                                <tbody id="lista-carrito"></tbody>
                            </table>
                        </div>

                        <hr>
                        <h5>Total a Pagar: <span id="total-pagar" class="text-success fw-bold">S/ 0.00</span></h5>

                        <div class="mb-3 mt-3">
                            <label class="form-label fw-bold">Método de Pago:</label>
                            <select id="metodo-pago" class="form-select">
                                <option value="Efectivo al recibir">Efectivo</option>
                                <option value="Yape / Plin">Yape / Plin (BCP)</option>
                                <option value="Tarjeta POS">Tarjeta POS</option>
                            </select>
                        </div>

                        <div class="d-grid">
                            <button class="btn btn-success btn-lg" onclick="enviarPedido()">Enviar Pedido a Caja</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const productos = [
            // Hamburguesas de Carne
            { id: 1, categoria: "Hamburguesas de Carne", nombre: "Clásica (Carne)", precio: 10.00 },
            { id: 2, categoria: "Hamburguesas de Carne", nombre: "Cheese Burguer", precio: 11.50 },
            { id: 3, categoria: "Hamburguesas de Carne", nombre: "Royal Burguer", precio: 13.00 },
            { id: 4, categoria: "Hamburguesas de Carne", nombre: "Bacon Cheese Burger", precio: 17.00 },
            { id: 5, categoria: "Hamburguesas de Carne", nombre: "Mix Burguer", precio: 19.00 },
            { id: 6, categoria: "Hamburguesas de Carne", nombre: "Super Mix Burguer", precio: 21.00 },

            // Hamburguesas de Pollo
            { id: 7, categoria: "Hamburguesas de Pollo", nombre: "Deshilachado Clásico", precio: 10.00 },
            { id: 8, categoria: "Hamburguesas de Pollo", nombre: "Cheese Chicken", precio: 11.50 },
            { id: 9, categoria: "Hamburguesas de Pollo", nombre: "Royal Chicken", precio: 13.00 },
            { id: 10, categoria: "Hamburguesas de Pollo", nombre: "Bacon Cheese Chicken", precio: 17.00 },
            { id: 11, categoria: "Hamburguesas de Pollo", nombre: "Mix Chicken", precio: 19.00 },
            { id: 12, categoria: "Hamburguesas de Pollo", nombre: "Super Mix Chicken", precio: 21.00 },

            // Hamburguesas de Chorizo
            { id: 13, categoria: "Hamburguesas de Chorizo", nombre: "Chorizo Clásico", precio: 12.00 },
            { id: 14, categoria: "Hamburguesas de Chorizo", nombre: "Cheese Chorizo", precio: 12.50 },
            { id: 15, categoria: "Hamburguesas de Chorizo", nombre: "Royal Chorizo", precio: 14.00 },
            { id: 16, categoria: "Hamburguesas de Chorizo", nombre: "Bacon Cheese Chorizo", precio: 17.00 },

            // Broaster
            { id: 17, categoria: "Broaster", nombre: "Alita Broaster", precio: 11.00 },
            { id: 18, categoria: "Broaster", nombre: "Pierna o Encuentro", precio: 12.00 },
            { id: 19, categoria: "Broaster", nombre: "Pecho Broaster", precio: 14.00 },
            { id: 20, categoria: "Broaster", nombre: "Porción de Alitas (4 pzs)", precio: 12.00 },
            { id: 21, categoria: "Broaster", nombre: "1/4 de Pollo", precio: 21.00 },
            { id: 22, categoria: "Broaster", nombre: "1/2 de Pollo", precio: 40.00 },
            { id: 23, categoria: "Broaster", nombre: "1 Pollo Entero", precio: 76.00 },

            // Salchipapas
            { id: 24, categoria: "Salchipapas", nombre: "Salchipapa Clásica", precio: 11.00 },
            { id: 25, categoria: "Salchipapas", nombre: "Clásica de Huevo", precio: 12.50 },
            { id: 26, categoria: "Salchipapas", nombre: "Salchi Chicken", precio: 16.00 },
            { id: 27, categoria: "Salchipapas", nombre: "Salchi Burger", precio: 15.00 },
            { id: 28, categoria: "Salchipapas", nombre: "Salchi Especial", precio: 19.00 },
            { id: 29, categoria: "Salchipapas", nombre: "Super Salchi Especial", precio: 20.00 },

            // Enchiladas
            { id: 30, categoria: "Enchiladas", nombre: "Enchilada Hot Dog", precio: 13.00 },
            { id: 31, categoria: "Enchiladas", nombre: "Enchilada Carne", precio: 14.00 },
            { id: 32, categoria: "Enchiladas", nombre: "Enchilada Pollo", precio: 15.00 },
            { id: 33, categoria: "Enchiladas", nombre: "Enchilada Chorizo", precio: 15.00 },
            { id: 34, categoria: "Enchiladas", nombre: "Enchilada Mixta", precio: 17.00 },
            { id: 35, categoria: "Enchiladas", nombre: "Enchilada Extravaganza", precio: 20.00 },

            // Filete de Pechuga
            { id: 36, categoria: "Filete de Pechuga", nombre: "Filete Clásico", precio: 12.00 },
            { id: 37, categoria: "Filete de Pechuga", nombre: "Cheese Filete", precio: 13.00 },
            { id: 38, categoria: "Filete de Pechuga", nombre: "Royal Filete", precio: 15.00 },

            // Adicionales
            { id: 39, categoria: "Adicionales", nombre: "Adicional Queso", precio: 2.00 },
            { id: 40, categoria: "Adicionales", nombre: "Adicional Huevo", precio: 2.00 },
            { id: 41, categoria: "Adicionales", nombre: "Adicional Tocino", precio: 5.00 },
            { id: 42, categoria: "Adicionales", nombre: "Adicional Hot Dog", precio: 6.00 },
            { id: 43, categoria: "Adicionales", nombre: "Adicional Carne", precio: 5.00 },
            { id: 44, categoria: "Adicionales", nombre: "Adicional Chorizo", precio: 5.00 },
            { id: 45, categoria: "Adicionales", nombre: "Adicional Filete de Pollo", precio: 6.00 },
            { id: 46, categoria: "Adicionales", nombre: "Adicional Pollo Deshilachado", precio: 5.00 },

            // Bebidas
            { id: 47, categoria: "Bebidas", nombre: "Inca Kola 1.5 LT", precio: 8.50 },
            { id: 48, categoria: "Bebidas", nombre: "Coca Cola 1 LT", precio: 8.50 },
            { id: 49, categoria: "Bebidas", nombre: "Inca Kola Gordita", precio: 5.00 },
            { id: 50, categoria: "Bebidas", nombre: "Inca Kola 600 ml", precio: 4.00 },
            { id: 51, categoria: "Bebidas", nombre: "Coca Cola 600 ml", precio: 4.00 },
            { id: 52, categoria: "Bebidas", nombre: "Agua Personal", precio: 2.00 }
        ];

        let carrito = [];

        function cargarMenu() {
            const contenedor = document.getElementById('menu-productos');
            contenedor.innerHTML = '';

            // Agrupar por categoría
            const categorias = [...new Set(productos.map(p => p.categoria))];

            categorias.forEach(cat => {
                contenedor.innerHTML += `<h5 class="text-primary mt-3 border-bottom pb-1">${cat}</h5>`;
                let rowDiv = document.createElement('div');
                rowDiv.className = 'row';

                const prodsCat = productos.filter(p => p.categoria === cat);
                prodsCat.forEach(prod => {
                    rowDiv.innerHTML += `
                        <div class="col-sm-6 mb-3">
                            <div class="card h-100 shadow-sm border-0 bg-white">
                                <div class="card-body d-flex flex-column justify-content-between p-3">
                                    <div>
                                        <h6 class="card-title fw-bold mb-1">${prod.nombre}</h6>
                                        <p class="text-muted fw-bold mb-2">S/ ${prod.precio.toFixed(2)}</p>
                                    </div>
                                    <button class="btn btn-outline-primary btn-sm w-100" onclick="agregarAlCarrito(${prod.id})">+ Agregar</button>
                                </div>
                            </div>
                        </div>
                    `;
                });
                contenedor.appendChild(rowDiv);
            });
        }

        function agregarAlCarrito(id) {
            const producto = productos.find(p => p.id === id);
            const itemEnCarrito = carrito.find(item => item.id === id);
            if (itemEnCarrito) {
                itemEnCarrito.cantidad++;
            } else {
                carrito.push({ ...producto, cantidad: 1 });
            }
            actualizarCarrito();
        }

        function cambiarCantidad(id, cambio) {
            const item = carrito.find(p => p.id === id);
            if (item) {
                item.cantidad += cambio;
                if (item.cantidad <= 0) {
                    carrito = carrito.filter(p => p.id !== id);
                }
            }
            actualizarCarrito();
        }

        function actualizarCarrito() {
            const tbody = document.getElementById('lista-carrito');
            const spanTotal = document.getElementById('total-pagar');
            tbody.innerHTML = '';
            let total = 0;

            if (carrito.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="text-center text-muted">Aún no hay productos seleccionados</td></tr>`;
                spanTotal.innerText = `S/ 0.00`;
                return;
            }

            carrito.forEach(item => {
                let subtotal = item.precio * item.cantidad;
                total += subtotal;
                tbody.innerHTML += `
                    <tr>
                        <td style="font-size: 0.9rem;">${item.nombre}</td>
                        <td>
                            <button class="btn btn-sm btn-outline-secondary py-0 px-1" onclick="cambiarCantidad(${item.id}, -1)">-</button>
                            <span class="mx-1">${item.cantidad}</span>
                            <button class="btn btn-sm btn-outline-secondary py-0 px-1" onclick="cambiarCantidad(${item.id}, 1)">+</button>
                        </td>
                        <td style="font-size: 0.9rem;">S/ ${subtotal.toFixed(2)}</td>
                        <td><button class="btn btn-danger btn-sm py-0 px-1" onclick="cambiarCantidad(${item.id}, -${item.cantidad})">&times;</button></td>
                    </tr>
                `;
            });
            spanTotal.innerText = `S/ ${total.toFixed(2)}`;
        }

        function enviarPedido() {
            if (carrito.length === 0) {
                alert("Agrega al menos un producto a tu pedido.");
                return;
            }
            const cliente = document.getElementById('nombre-cliente').value.trim();
            if (!cliente) {
                alert("Por favor ingresa tu número de mesa o nombre.");
                return;
            }

            const nuevoPedido = {
                id: Date.now(),
                cliente: cliente,
                items: [...carrito],
                total: document.getElementById('total-pagar').innerText,
                metodo: document.getElementById('metodo-pago').value,
                estado: "Pendiente"
            };

            let pedidos = JSON.parse(localStorage.getItem('pedidos_restaurante')) || [];
            pedidos.push(nuevoPedido);
            localStorage.setItem('pedidos_restaurante', JSON.stringify(pedidos));

            alert("¡Pedido enviado con éxito a la cocina de El Cártel!");
            carrito = [];
            document.getElementById('nombre-cliente').value = '';
            actualizarCarrito();
        }

        actualizarCarrito();
        cargarMenu();
    </script>
</body>
</html>
