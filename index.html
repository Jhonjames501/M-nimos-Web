<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Cártel del Buen Sabor - POS Digital</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome para Iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #0f0f0f;
            color: #f8f9fa;
        }
        .header-cartel {
            background: linear-gradient(135deg, #141414 0%, #1f1f1f 100%);
            color: white;
            border-bottom: 4px solid #ffc107;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .card-producto {
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            border: 1px solid rgba(255,255,255,0.08);
            background-color: #1a1a1a !important;
            border-radius: 16px;
            overflow: hidden;
        }
        .card-producto:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 25px rgba(255, 193, 7, 0.15);
            border-color: #ffc107;
        }
        .card-img-top {
            height: 140px;
            object-fit: cover;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .btn-cartel {
            background: linear-gradient(135deg, #ffc107 0%, #ff9800 100%);
            color: #000;
            font-weight: 700;
            border: none;
            box-shadow: 0 4px 10px rgba(255, 193, 7, 0.3);
            transition: all 0.2s ease;
        }
        .btn-cartel:hover {
            background: linear-gradient(135deg, #ffca2c 0%, #f57c00 100%);
            color: #000;
            transform: scale(1.02);
        }
        .badge-categoria {
            font-size: 0.70rem;
            letter-spacing: 0.5px;
            background-color: #2b2b2b !important;
            color: #ffc107 !important;
        }
        .carrito-card {
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            background-color: #1a1a1a !important;
            color: #fff;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }
        .form-control, .form-select {
            background-color: #2b2b2b !important;
            color: #fff !important;
            border: 1px solid rgba(255,255,255,0.1) !important;
        }
        .form-control:focus, .form-select:focus {
            border-color: #ffc107 !important;
            box-shadow: 0 0 0 0.25rem rgba(255, 193, 7, 0.25);
        }
        .table {
            color: #f8f9fa !important;
        }
        .table-light {
            background-color: #2b2b2b !important;
            color: #ffc107 !important;
        }
        .yape-box-card {
            background: linear-gradient(135deg, #741584 0%, #510d5c 100%);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            color: white;
            margin-top: 15px;
            box-shadow: 0 4px 15px rgba(116, 21, 132, 0.4);
        }
        .btn-whatsapp-yape {
            display: block;
            background-color: #25d366;
            color: white;
            padding: 10px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            margin-top: 10px;
            transition: background 0.2s;
        }
        .btn-whatsapp-yape:hover {
            background-color: #1ebd5b;
            color: white;
        }
    </style>
</head>
<body>

    <!-- Encabezado Estilizado -->
    <header class="header-cartel py-4 mb-4">
        <div class="container text-center">
            <h1 class="fw-bold mb-1 text-warning"><i class="fas fa-cash-register me-2"></i>EL CÁRTEL</h1>
            <p class="text-light mb-0 fs-5 fw-light">Punto de Venta - POS Digital</p>
            <span class="badge bg-danger mt-2 px-3 py-1 fst-italic">¡Condenados a comer rico!</span>
        </div>
    </header>

    <div class="container mb-5">
        <!-- Filtros por Categoría -->
        <div class="d-flex overflow-auto pb-3 mb-4 gap-2" id="filtro-categorias" style="white-space: nowrap;">
            <button class="btn btn-warning btn-sm rounded-pill px-3 active fw-bold shadow-sm" onclick="filtrarCategoria('Todos')"><i class="fas fa-th-large me-1"></i> Ver Todo</button>
        </div>

        <div class="row g-4">
            <!-- Menú de Productos -->
            <div class="col-lg-7">
                <div class="row g-3" id="menu-productos"></div>
            </div>

            <!-- Resumen del POS / Carrito -->
            <div class="col-lg-5">
                <div class="card carrito-card sticky-top p-3" style="top: 20px;">
                    <div class="card-body">
                        <h4 class="card-title fw-bold mb-3 text-warning"><i class="fas fa-receipt me-2"></i>Terminal POS</h4>
                        
                        <!-- Tipo de Servicio -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold small text-light"><i class="fas fa-concierge-bell me-1 text-warning"></i> Tipo de Servicio:</label>
                            <select id="tipo-servicio" class="form-select border-0" onchange="cambiarTipoServicio()">
                                <option value="Local">🍽️ Consumo en Local (Mesa)</option>
                                <option value="Llevar">🛍️ Para Llevar</option>
                                <option value="Delivery">🛵 Delivery</option>
                            </select>
                        </div>

                        <!-- Datos del Cliente / Mesa -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold small text-light" id="label-cliente"><i class="fas fa-user-tag me-1 text-warning"></i> N° de Mesa o Nombre:</label>
                            <input type="text" id="nombre-cliente" class="form-control form-control-lg border-0" placeholder="Ej: Mesa 4 o Juan Pérez">
                        </div>

                        <!-- Detalle de Ítems -->
                        <div class="table-responsive mb-3" style="max-height: 220px; overflow-y: auto;">
                            <table class="table table-sm align-middle">
                                <thead class="table-light rounded">
                                    <tr>
                                        <th class="ps-2">Item</th>
                                        <th>Cant</th>
                                        <th>Subtotal</th>
                                        <th></th>
                                    </tr>
                                </thead>
                                <tbody id="lista-carrito"></tbody>
                            </table>
                        </div>

                        <div class="bg-dark p-3 rounded-3 mb-3 border border-secondary">
                            <div class="d-flex justify-content-between align-items-center">
                                <span class="fw-bold fs-5">Total a Pagar:</span>
                                <span id="total-pagar" class="text-warning fw-bold fs-4">S/ 0.00</span>
                            </div>
                        </div>

                        <!-- Método de Pago -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold small text-light"><i class="fas fa-wallet me-1 text-warning"></i> Método de Pago:</label>
                            <select id="metodo-pago" class="form-select border-0" onchange="verificarMetodoPago()">
                                <option value="Efectivo al recibir">💵 Efectivo</option>
                                <option value="Yape / Plin">📱 Yape / Plin (BCP)</option>
                                <option value="Tarjeta POS">💳 Tarjeta POS</option>
                            </select>
                        </div>

                        <!-- Sección Interactiva de Yape -->
                        <div id="seccion-yape" style="display: none;" class="yape-box-card mb-3">
                            <h6 class="fw-bold mb-1">Escanea para Yapear</h6>
                            <p class="small mb-2 text-light" style="font-size: 0.8rem;">Titular: <strong>Jhon James Espinoza Hoyos</strong></p>
                            <img src="9986_2.png" alt="QR Yape" style="width: 140px; border-radius: 8px; background: white; padding: 5px;" class="mb-2">
                            <p class="small mb-1" style="font-size: 0.75rem;">Manda tu captura al WhatsApp:</p>
                            <a id="btn-wsp-yape" href="#" target="_blank" class="btn-whatsapp-yape">
                                <i class="fab fa-whatsapp me-1"></i> Enviar Comprobante (+51 996887022)
                            </a>
                        </div>

                        <div class="d-grid">
                            <button class="btn btn-cartel btn-lg py-3 shadow-sm fw-bold" onclick="enviarPedido()">
                                <i class="fas fa-paper-plane me-2"></i> Procesar y Enviar Pedido
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal para Personalizar Producto -->
    <div class="modal fade" id="modalNota" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg rounded-4 bg-dark text-white">
                <div class="modal-header border-secondary rounded-top-4">
                    <h5 class="modal-title fw-bold text-warning" id="titulo-modal-producto">Personalizar Pedido</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4">
                    <input type="hidden" id="modal-producto-id">
                    
                    <label class="form-label fw-bold text-warning mb-3"><i class="fas fa-bottle-droplet me-1"></i> Elige tus Cremas:</label>
                    <div class="row g-2 mb-4" id="lista-cremas-checkbox">
                        <div class="col-6"><div class="form-check p-2 bg-secondary bg-opacity-25 rounded border border-secondary"><input class="form-check-input crema-opcion ms-1" type="checkbox" value="Mayonesa" id="crema1"><label class="form-check-label ms-2 fw-medium" for="crema1">Mayonesa</label></div></div>
                        <div class="col-6"><div class="form-check p-2 bg-secondary bg-opacity-25 rounded border border-secondary"><input class="form-check-input crema-opcion ms-1" type="checkbox" value="Ketchup" id="crema2"><label class="form-check-label ms-2 fw-medium" for="crema2">Ketchup</label></div></div>
                        <div class="col-6"><div class="form-check p-2 bg-secondary bg-opacity-25 rounded border border-secondary"><input class="form-check-input crema-opcion ms-1" type="checkbox" value="Mostaza" id="crema3"><label class="form-check-label ms-2 fw-medium" for="crema3">Mostaza</label></div></div>
                        <div class="col-6"><div class="form-check p-2 bg-secondary bg-opacity-25 rounded border border-secondary"><input class="form-check-input crema-opcion ms-1" type="checkbox" value="Aji" id="crema4"><label class="form-check-label ms-2 fw-medium" for="crema4">Ají</label></div></div>
                        <div class="col-6"><div class="form-check p-2 bg-secondary bg-opacity-25 rounded border border-secondary"><input class="form-check-input crema-opcion ms-1" type="checkbox" value="Tartara" id="crema5"><label class="form-check-label ms-2 fw-medium" for="crema5">Tártara</label></div></div>
                        <div class="col-6"><div class="form-check p-2 bg-secondary bg-opacity-25 rounded border border-secondary"><input class="form-check-input crema-opcion ms-1" type="checkbox" value="Golf" id="crema6"><label class="form-check-label ms-2 fw-medium" for="crema6">Golf</label></div></div>
                        <div class="col-12"><div class="form-check p-2 bg-secondary bg-opacity-25 rounded border border-secondary"><input class="form-check-input crema-opcion ms-1" type="checkbox" value="Aceituna" id="crema7"><label class="form-check-label ms-2 fw-medium" for="crema7">Aceituna</label></div></div>
                    </div>

                    <div class="mb-2">
                        <label class="form-label fw-bold text-warning"><i class="fas fa-comment-alt me-1"></i> Nota adicional (Opcional):</label>
                        <input type="text" id="nota-producto" class="form-control border-0" placeholder="Ej: Sin cebolla, papas crocantes">
                    </div>
                </div>
                <div class="modal-footer border-0 p-4 pt-0">
                    <button type="button" class="btn btn-outline-light px-4 rounded-pill" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-cartel px-4 rounded-pill fw-bold" onclick="confirmarAgregarConNota()">Agregar al Pedido</button>
                </div>
            </div>
        </div>
    </div>

            // Bebidas
            { id: 47, categoria: "Bebidas", nombre: "Inca Kola 1.5 LT", precio: 8.50, img: "https://images.unsplash.com/photo-1622483767028-3f66f32aef97?auto=format&fit=crop&w=500&q=80" },
            { id: 48, categoria: "Bebidas", nombre: "Coca Cola 1 LT", precio: 8.50, img: "https://images.unsplash.com/photo-1554866585-cd94860890b7?auto=format&fit=crop&w=500&q=80" },
            { id: 49, categoria: "Bebidas", nombre: "Inca Kola Gordita", precio: 5.00, img: "https://images.unsplash.com/photo-1622483767028-3f66f32aef97?auto=format&fit=crop&w=500&q=80" },
            { id: 50, categoria: "Bebidas", nombre: "Inca Kola 600 ml", precio: 4.00, img: "https://images.unsplash.com/photo-1622483767028-3f66f32aef97?auto=format&fit=crop&w=500&q=80" },
            { id: 51, categoria: "Bebidas", nombre: "Coca Cola 600 ml", precio: 4.00, img: "https://images.unsplash.com/photo-1554866585-cd94860890b7?auto=format&fit=crop&w=500&q=80" },
            { id: 52, categoria: "Bebidas", nombre: "Agua Personal", precio: 2.00, img: "https://images.unsplash.com/photo-1548839140-29a749e1cf4d?auto=format&fit=crop&w=500&q=80" }
        ];

        let carrito = [];
        let categoriaActual = 'Todos';

        function inicializarFiltros() {
            const contenedorFiltros = document.getElementById('filtro-categorias');
            const categorias = ['Todos', ...new Set(productos.map(p => p.categoria))];
            
            categorias.forEach(cat => {
                if(cat !== 'Todos') {
                    contenedorFiltros.innerHTML += `<button class="btn btn-outline-warning btn-sm rounded-pill px-3 shadow-sm" onclick="filtrarCategoria('${cat}')">${cat}</button>`;
                }
            });
        }

        function filtrarCategoria(cat) {
            categoriaActual = cat;
            const botones = document.querySelectorAll('#filtro-categorias button');
            botones.forEach(btn => {
                if(btn.innerText.includes(cat) || (cat === 'Todos' && btn.innerText.includes('Ver Todo'))) {
                    btn.className = "btn btn-warning btn-sm rounded-pill px-3 active fw-bold shadow-sm";
                } else {
                    btn.className = "btn btn-outline-warning btn-sm rounded-pill px-3 shadow-sm";
                }
            });
            cargarMenu();
        }

        function cargarMenu() {
            const contenedor = document.getElementById('menu-productos');
            contenedor.innerHTML = '';

            const agotados = JSON.parse(localStorage.getItem('platos_agotados')) || [];
            const prodsFiltrados = categoriaActual === 'Todos' 
                ? productos 
                : productos.filter(p => p.categoria === categoriaActual);

            prodsFiltrados.forEach(prod => {
                if (agotados.includes(prod.id)) return;

                contenedor.innerHTML += `
                    <div class="col-sm-6">
                        <div class="card card-producto h-100">
                            <img src="${prod.img}" class="card-img-top" alt="${prod.nombre}">
                            <div class="card-body d-flex flex-column justify-content-between p-3">
                                <div>
                                    <span class="badge badge-categoria border mb-2 rounded-pill px-2 py-1">${prod.categoria}</span>
                                    <h6 class="card-title fw-bold text-white mb-1">${prod.nombre}</h6>
                                    <p class="text-warning fw-bold fs-5 mb-3">S/ ${prod.precio.toFixed(2)}</p>
                                </div>
                                <button class="btn btn-outline-warning btn-sm w-100 rounded-pill py-2 fw-semibold" onclick="abrirModalNota(${prod.id})">
                                    <i class="fas fa-plus-circle me-1"></i> Agregar
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function cambiarTipoServicio() {
            const tipo = document.getElementById('tipo-servicio').value;
            const labelCliente = document.getElementById('label-cliente');
            const inputCliente = document.getElementById('nombre-cliente');

            if (tipo === 'Local') {
                labelCliente.innerHTML = `<i class="fas fa-user-tag me-1 text-warning"></i> N° de Mesa o Nombre:`;
                inputCliente.placeholder = "Ej: Mesa 4 o Juan Pérez";
            } else if (tipo === 'Llevar') {
                labelCliente.innerHTML = `<i class="fas fa-user me-1 text-warning"></i> Nombre para recojo:`;
                inputCliente.placeholder = "Ej: Carlos Ruiz";
            } else if (tipo === 'Delivery') {
                labelCliente.innerHTML = `<i class="fas fa-map-marker-alt me-1 text-warning"></i> Nombre y Dirección de Entrega:`;
                inputCliente.placeholder = "Ej: Ana Gómez - Av. Perú 123";
            }
        }

        function abrirModalNota(id) {
            const prod = productos.find(p => p.id === id);
            document.getElementById('modal-producto-id').value = id;
            document.getElementById('titulo-modal-producto').innerText = `Personalizar: ${prod.nombre}`;
            document.getElementById('nota-producto').value = '';
            
            document.querySelectorAll('.crema-opcion').forEach(el => el.checked = false);

            const modal = new bootstrap.Modal(document.getElementById('modalNota'));
            modal.show();
        }

        function confirmarAgregarConNota() {
            const id = parseInt(document.getElementById('modal-producto-id').value);
            const notaPersonalizada = document.getElementById('nota-producto').value.trim();
            const producto = productos.find(p => p.id === id);

            let cremasSeleccionadas = [];
            document.querySelectorAll('.crema-opcion:checked').forEach(el => {
                cremasSeleccionadas.push(el.value);
            });

            let textoDetalle = "";
            if (cremasSeleccionadas.length > 0) {
                textoDetalle += `Cremas: ${cremasSeleccionadas.join(', ')}`;
            }
            if (notaPersonalizada) {
                textoDetalle += (textoDetalle ? " | " : "") + `Nota: ${notaPersonalizada}`;
            }

            const itemUnicoId = `${id}-${textoDetalle}`;
            const itemEnCarrito = carrito.find(item => item.itemUnicoId === itemUnicoId);

            if (itemEnCarrito) {
                itemEnCarrito.cantidad++;
            } else {
                carrito.push({
                    itemUnicoId: itemUnicoId,
                    id: producto.id,
                    nombre: producto.nombre,
                    precio: producto.precio,
                    cantidad: 1,
                    detalles: textoDetalle
                });
            }

            const modalEl = document.getElementById('modalNota');
            const modal = bootstrap.Modal.getInstance(modalEl);
            modal.hide();

            actualizarCarrito();
        }

        function cambiarCantidad(itemUnicoId, cambio) {
            const item = carrito.find(p => p.itemUnicoId === itemUnicoId);
            if (item) {
                item.cantidad += cambio;
                if (item.cantidad <= 0) {
                    carrito = carrito.filter(p => p.itemUnicoId !== itemUnicoId);
                }
            }
            actualizarCarrito();
        }

        function actualizarCarrito() {
            const tbody = document.getElementById('lista-carrito');
            const spanTotal = document.getElementById('total-pagar');
            tbody.innerHTML = '';
            let total = 0;

            if (carrito.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="text-center text-muted py-4">Aún no hay productos seleccionados</td></tr>`;
                spanTotal.innerText = `S/ 0.00`;
                actualizarEnlaceWhatsAppYape(0);
                return;
            }

            carrito.forEach(item => {
                let subtotal = item.precio * item.cantidad;
                total += subtotal;
                let textoDetallesHtml = item.detalles ? `<br><small class="text-warning fw-semibold">👉 ${item.detalles}</small>` : '';
                
                tbody.innerHTML += `
                    <tr>
                        <td class="ps-2 text-light" style="font-size: 0.85rem;">${item.nombre} ${textoDetallesHtml}</td>
                        <td style="white-space: nowrap;">
                            <button class="btn btn-sm btn-outline-warning py-0 px-1 rounded-circle" onclick="cambiarCantidad('${item.itemUnicoId}', -1)">-</button>
                            <span class="mx-1 fw-bold text-white">${item.cantidad}</span>
                            <button class="btn btn-sm btn-outline-warning py-0 px-1 rounded-circle" onclick="cambiarCantidad('${item.itemUnicoId}', 1)">+</button>
                        </td>
                        <td style="font-size: 0.85rem;" class="fw-semibold text-warning">S/ ${subtotal.toFixed(2)}</td>
                        <td><button class="btn btn-outline-danger btn-sm py-0 px-1 border-0" onclick="cambiarCantidad('${item.itemUnicoId}', -${item.cantidad})"><i class="fas fa-trash-alt"></i></button></td>
                    </tr>
                `;
            });
            spanTotal.innerText = `S/ ${total.toFixed(2)}`;
            actualizarEnlaceWhatsAppYape(total);
        }

        function verificarMetodoPago() {
            const metodo = document.getElementById('metodo-pago').value;
            const seccionYape = document.getElementById('seccion-yape');
            if (metodo.includes('Yape')) {
                seccionYape.style.display = 'block';
            } else {
                seccionYape.style.display = 'none';
            }
        }

        function actualizarEnlaceWhatsAppYape(total) {
            const cliente = document.getElementById('nombre-cliente').value || "Cliente";
            const tipoServicio = document.getElementById('tipo-servicio').value;
            let mensaje = `Hola, soy ${cliente} (${tipoServicio}). Adjunto mi comprobante de Yape por S/ ${total.toFixed(2)} para confirmar mi pedido en El Cártel.`;
            let urlWsp = `https://wa.me/51996887022?text=${encodeURIComponent(mensaje)}`;
            document.getElementById('btn-wsp-yape').href = urlWsp;
        }

        function enviarPedido() {
            if (carrito.length === 0) {
                alert("Agrega al menos un producto al POS.");
                return;
            }
            const cliente = document.getElementById('nombre-cliente').value.trim();
            if (!cliente) {
                alert("Por favor ingresa la mesa o los datos del cliente.");
                return;
            }

            const nuevoPedido = {
                id: Date.now(),
                tipoServicio: document.getElementById('tipo-servicio').value,
                cliente: cliente,
                items: [...carrito],
                total: document.getElementById('total-pagar').innerText,
                metodo: document.getElementById('metodo-pago').value,
                estado: "Pendiente"
            };

            let pedidos = JSON.parse(localStorage.getItem('pedidos_restaurante')) || [];
            pedidos.push(nuevoPedido);
            localStorage.setItem('pedidos_restaurante', JSON.stringify(pedidos));

            alert("¡Pedido procesado y enviado a caja con éxito!");
            carrito = [];
            document.getElementById('nombre-cliente').value = '';
            actualizarCarrito();
        }

        document.getElementById('nombre-cliente').addEventListener('input', () => {
            const total = parseFloat(document.getElementById('total-pagar').innerText.replace('S/', '').trim()) || 0;
            actualizarEnlaceWhatsAppYape(total);
        });

        inicializarFiltros();
        actualizarCarrito();
        cargarMenu();
    </script>
</body>
</html>
