<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Cártel del Buen Sabor - Pedidos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container my-4">
        <div class="text-center mb-4">
            <h2 class="fw-bold">🍔 EL CÁRTEL <span class="text-muted fs-5">del buen sabor</span></h2>
            <p class="text-danger fst-italic">¡Condenados a comer rico!</p>
        </div>

        <!-- Botones de Filtro por Categoría -->
        <div class="d-flex overflow-auto pb-2 mb-3 gap-2" id="filtro-categorias">
            <button class="btn btn-dark btn-sm flex-shrink-0 active" onclick="filtrarCategoria('Todos')">Ver Todo</button>
        </div>

        <div class="row">
            <!-- Menú de Productos -->
            <div class="col-lg-7 mb-4">
                <div class="row" id="menu-productos"></div>
            </div>

            <!-- Resumen del pedido -->
            <div class="col-lg-5">
                <div class="card shadow-sm sticky-top" style="top: 20px;">
                    <div class="card-body">
                        <h4 class="card-title mb-3">Tu Pedido Actual</h4>
                        
                        <div class="mb-3">
                            <label class="form-label fw-bold">Número de Mesa o Nombre:</label>
                            <input type="text" id="nombre-cliente" class="form-control" placeholder="Ej: Mesa 4 o Juan Pérez">
                        </div>

                        <div class="table-responsive" style="max-height: 250px; overflow-y: auto;">
                            <table class="table table-sm align-middle">
                                <thead>
                                    <tr>
                                        <th>Item</th>
                                        <th>Cant</th>
                                        <th>Subtotal</th>
                                        <th></th>
                                    </tr>
                                </thead>
                                <tbody id="lista-carrito"></tbody>
                            </table>
                        </div>

                        <hr>
                        <h5>Total a Pagar: <span id="total-pagar" class="text-success fw-bold">S/ 0.00</span></h5>

                        <div class="mb-3 mt-3">
                            <label class="form-label fw-bold">Método de Pago:</label>
                            <select id="metodo-pago" class="form-select">
                                <option value="Efectivo al recibir">Efectivo</option>
                                <option value="Yape / Plin">Yape / Plin (BCP)</option>
                                <option value="Tarjeta POS">Tarjeta POS</option>
                            </select>
                        </div>

                        <div class="d-grid">
                            <button class="btn btn-success btn-lg" onclick="enviarPedido()">Enviar Pedido a Caja</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal para Agregar Cremas y Notas -->
    <div class="modal fade" id="modalNota" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="titulo-modal-producto">Personalizar Pedido</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="modal-producto-id">
                    
                    <label class="form-label fw-bold text-dark mb-2">Elige tus Cremas:</label>
                    <div class="row g-2 mb-3" id="lista-cremas-checkbox">
                        <div class="col-6"><div class="form-check"><input class="form-check-input crema-opcion" type="checkbox" value="Mayonesa" id="crema1"><label class="form-check-label" for="crema1">Mayonesa</label></div></div>
                        <div class="col-6"><div class="form-check"><input class="form-check-input crema-opcion" type="checkbox" value="Ketchup" id="crema2"><label class="form-check-label" for="crema2">Ketchup</label></div></div>
                        <div class="col-6"><div class="form-check"><input class="form-check-input crema-opcion" type="checkbox" value="Mostaza" id="crema3"><label class="form-check-label" for="crema3">Mostaza</label></div></div>
                        <div class="col-6"><div class="form-check"><input class="form-check-input crema-opcion" type="checkbox" value="Aji" id="crema4"><label class="form-check-label" for="crema4">Ají</label></div></div>
                        <div class="col-6"><div class="form-check"><input class="form-check-input crema-opcion" type="checkbox" value="Tartara" id="crema5"><label class="form-check-label" for="crema5">Tártara</label></div></div>
                        <div class="col-6"><div class="form-check"><input class="form-check-input crema-opcion" type="checkbox" value="Golf" id="crema6"><label class="form-check-label" for="crema6">Golf</label></div></div>
                        <div class="col-6"><div class="form-check"><input class="form-check-input crema-opcion" type="checkbox" value="Aceituna" id="crema7"><label class="form-check-label" for="crema7">Aceituna</label></div></div>
                    </div>

                    <div class="mb-2">
                        <label class="form-label fw-bold text-dark">Nota adicional (Opcional):</label>
                        <input type="text" id="nota-producto" class="form-control" placeholder="Ej: Papas bien crocantes">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary btn-sm" onclick="confirmarAgregarConNota()">Agregar al Pedido</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const productos = [
            { id: 1, categoria: "Hamburguesas de Carne", nombre: "Clásica (Carne)", precio: 10.00 },
            { id: 2, categoria: "Hamburguesas de Carne", nombre: "Cheese Burguer", precio: 11.50 },
            { id: 3, categoria: "Hamburguesas de Carne", nombre: "Royal Burguer", precio: 13.00 },
            { id: 4, categoria: "Hamburguesas de Carne", nombre: "Bacon Cheese Burger", precio: 17.00 },
            { id: 5, categoria: "Hamburguesas de Carne", nombre: "Mix Burguer", precio: 19.00 },
            { id: 6, categoria: "Hamburguesas de Carne", nombre: "Super Mix Burguer", precio: 21.00 },

            { id: 7, categoria: "Hamburguesas de Pollo", nombre: "Deshilachado Clásico", precio: 10.00 },
            { id: 8, categoria: "Hamburguesas de Pollo", nombre: "Cheese Chicken", precio: 11.50 },
            { id: 9, categoria: "Hamburguesas de Pollo", nombre: "Royal Chicken", precio: 13.00 },
            { id: 10, categoria: "Hamburguesas de Pollo", nombre: "Bacon Cheese Chicken", precio: 17.00 },
            { id: 11, categoria: "Hamburguesas de Pollo", nombre: "Mix Chicken", precio: 19.00 },
            { id: 12, categoria: "Hamburguesas de Pollo", nombre: "Super Mix Chicken", precio: 21.00 },

            { id: 13, categoria: "Hamburguesas de Chorizo", nombre: "Chorizo Clásico", precio: 12.00 },
            { id: 14, categoria: "Hamburguesas de Chorizo", nombre: "Cheese Chorizo", precio: 12.50 },
            { id: 15, categoria: "Hamburguesas de Chorizo", nombre: "Royal Chorizo", precio: 14.00 },
            { id: 16, categoria: "Hamburguesas de Chorizo", nombre: "Bacon Cheese Chorizo", precio: 17.00 },

            { id: 17, categoria: "Broaster", nombre: "Alita Broaster", precio: 11.00 },
            { id: 18, categoria: "Broaster", nombre: "Pierna o Encuentro", precio: 12.00 },
            { id: 19, categoria: "Broaster", nombre: "Pecho Broaster", precio: 14.00 },
            { id: 20, categoria: "Broaster", nombre: "Porción de Alitas (4 pzs)", precio: 12.00 },
            { id: 21, categoria: "Broaster", nombre: "1/4 de Pollo", precio: 21.00 },
            { id: 22, categoria: "Broaster", nombre: "1/2 de Pollo", precio: 40.00 },
            { id: 23, categoria: "Broaster", nombre: "1 Pollo Entero", precio: 76.00 },

            { id: 24, categoria: "Salchipapas", nombre: "Salchipapa Clásica", precio: 11.00 },
            { id: 25, categoria: "Salchipapas", nombre: "Clásica de Huevo", precio: 12.50 },
            { id: 26, categoria: "Salchipapas", nombre: "Salchi Chicken", precio: 16.00 },
            { id: 27, categoria: "Salchipapas", nombre: "Salchi Burger", precio: 15.00 },
            { id: 28, categoria: "Salchipapas", nombre: "Salchi Especial", precio: 19.00 },
            { id: 29, categoria: "Salchipapas", nombre: "Super Salchi Especial", precio: 20.00 },

            { id: 30, categoria: "Enchiladas", nombre: "Enchilada Hot Dog", precio: 13.00 },
            { id: 31, categoria: "Enchiladas", nombre: "Enchilada Carne", precio: 14.00 },
            { id: 32, categoria: "Enchiladas", nombre: "Enchilada Pollo", precio: 15.00 },
            { id: 33, categoria: "Enchiladas", nombre: "Enchilada Chorizo", precio: 15.00 },
            { id: 34, categoria: "Enchiladas", nombre: "Enchilada Mixta", precio: 17.00 },
            { id: 35, categoria: "Enchiladas", nombre: "Enchilada Extravaganza", precio: 20.00 },

            { id: 36, categoria: "Filete de Pechuga", nombre: "Filete Clásico", precio: 12.00 },
            { id: 37, categoria: "Filete de Pechuga", nombre: "Cheese Filete", precio: 13.00 },
            { id: 38, categoria: "Filete de Pechuga", nombre: "Royal Filete", precio: 15.00 },

            { id: 39, categoria: "Adicionales", nombre: "Adicional Queso", precio: 2.00 },
            { id: 40, categoria: "Adicionales", nombre: "Adicional Huevo", precio: 2.00 },
            { id: 41, categoria: "Adicionales", nombre: "Adicional Tocino", precio: 5.00 },
            { id: 42, categoria: "Adicionales", nombre: "Adicional Hot Dog", precio: 6.00 },
            { id: 43, categoria: "Adicionales", nombre: "Adicional Carne", precio: 5.00 },
            { id: 44, categoria: "Adicionales", nombre: "Adicional Chorizo", precio: 5.00 },
            { id: 45, categoria: "Adicionales", nombre: "Adicional Filete de Pollo", precio: 6.00 },
            { id: 46, categoria: "Adicionales", nombre: "Adicional Pollo Deshilachado", precio: 5.00 },

            { id: 47, categoria: "Bebidas", nombre: "Inca Kola 1.5 LT", precio: 8.50 },
            { id: 48, categoria: "Bebidas", nombre: "Coca Cola 1 LT", precio: 8.50 },
            { id: 49, categoria: "Bebidas", nombre: "Inca Kola Gordita", precio: 5.00 },
            { id: 50, categoria: "Bebidas", nombre: "Inca Kola 600 ml", precio: 4.00 },
            { id: 51, categoria: "Bebidas", nombre: "Coca Cola 600 ml", precio: 4.00 },
            { id: 52, categoria: "Bebidas", nombre: "Agua Personal", precio: 2.00 }
        ];

        let carrito = [];
        let categoriaActual = 'Todos';

        function inicializarFiltros() {
            const contenedorFiltros = document.getElementById('filtro-categorias');
            const categorias = ['Todos', ...new Set(productos.map(p => p.categoria))];
            
            categorias.forEach(cat => {
                if(cat !== 'Todos') {
                    contenedorFiltros.innerHTML += `<button class="btn btn-outline-dark btn-sm flex-shrink-0" onclick="filtrarCategoria('${cat}')">${cat}</button>`;
                }
            });
        }

        function filtrarCategoria(cat) {
            categoriaActual = cat;
            const botones = document.querySelectorAll('#filtro-categorias button');
            botones.forEach(btn => {
                if(btn.innerText === cat) {
                    btn.className = "btn btn-dark btn-sm flex-shrink-0 active";
                } else {
                    btn.className = "btn btn-outline-dark btn-sm flex-shrink-0";
                }
            });
            cargarMenu();
        }

        function cargarMenu() {
            const contenedor = document.getElementById('menu-productos');
            contenedor.innerHTML = '';

            const agotados = JSON.parse(localStorage.getItem('platos_agotados')) || [];
            const prodsFiltrados = categoriaActual === 'Todos' 
                ? productos 
                : productos.filter(p => p.categoria === categoriaActual);

            let rowDiv = document.createElement('div');
            rowDiv.className = 'row';

            prodsFiltrados.forEach(prod => {
                // Si el plato está marcado como agotado en el admin, no se muestra
                if (agotados.includes(prod.id)) return;

                rowDiv.innerHTML += `
                    <div class="col-sm-6 mb-3">
                        <div class="card h-100 shadow-sm border-0 bg-white">
                            <div class="card-body d-flex flex-column justify-content-between p-3">
                                <div>
                                    <span class="badge bg-light text-secondary mb-1" style="font-size: 0.7rem;">${prod.categoria}</span>
                                    <h6 class="card-title fw-bold mb-1">${prod.nombre}</h6>
                                    <p class="text-muted fw-bold mb-2">S/ ${prod.precio.toFixed(2)}</p>
                                </div>
                                <button class="btn btn-outline-primary btn-sm w-100" onclick="abrirModalNota(${prod.id})">+ Agregar</button>
                            </div>
                        </div>
                    </div>
                `;
            });
            contenedor.appendChild(rowDiv);
        }

        function abrirModalNota(id) {
            const prod = productos.find(p => p.id === id);
            document.getElementById('modal-producto-id').value = id;
            document.getElementById('titulo-modal-producto').innerText = `Personalizar: ${prod.nombre}`;
            document.getElementById('nota-producto').value = '';
            
            // Limpiar los checkboxes de cremas al abrir
            document.querySelectorAll('.crema-opcion').forEach(el => el.checked = false);

            const modal = new bootstrap.Modal(document.getElementById('modalNota'));
            modal.show();
        }

        function confirmarAgregarConNota() {
            const id = parseInt(document.getElementById('modal-producto-id').value);
            const notaPersonalizada = document.getElementById('nota-producto').value.trim();
            const producto = productos.find(p => p.id === id);

            // Recopilar cremas seleccionadas
            let cremasSeleccionadas = [];
            document.querySelectorAll('.crema-opcion:checked').forEach(el => {
                cremasSeleccionadas.push(el.value);
            });

            let textoDetalle = "";
            if (cremasSeleccionadas.length > 0) {
                textoDetalle += `Cremas: ${cremasSeleccionadas.join(', ')}`;
            }
            if (notaPersonalizada) {
                textoDetalle += (textoDetalle ? " | " : "") + `Nota: ${notaPersonalizada}`;
            }

            const itemUnicoId = `${id}-${textoDetalle}`;
            const itemEnCarrito = carrito.find(item => item.itemUnicoId === itemUnicoId);

            if (itemEnCarrito) {
                itemEnCarrito.cantidad++;
            } else {
                carrito.push({
                    itemUnicoId: itemUnicoId,
                    id: producto.id,
                    nombre: producto.nombre,
                    precio: producto.precio,
                    cantidad: 1,
                    detalles: textoDetalle
                });
            }

            const modalEl = document.getElementById('modalNota');
            const modal = bootstrap.Modal.getInstance(modalEl);
            modal.hide();

            actualizarCarrito();
        }

        function cambiarCantidad(itemUnicoId, cambio) {
            const item = carrito.find(p => p.itemUnicoId === itemUnicoId);
            if (item) {
                item.cantidad += cambio;
                if (item.cantidad <= 0) {
                    carrito = carrito.filter(p => p.itemUnicoId !== itemUnicoId);
                }
            }
            actualizarCarrito();
        }

        function actualizarCarrito() {
            const tbody = document.getElementById('lista-carrito');
            const spanTotal = document.getElementById('total-pagar');
            tbody.innerHTML = '';
            let total = 0;

            if (carrito.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="text-center text-muted">Aún no hay productos seleccionados</td></tr>`;
                spanTotal.innerText = `S/ 0.00`;
                return;
            }

            carrito.forEach(item => {
                let subtotal = item.precio * item.cantidad;
                total += subtotal;
                let textoDetallesHtml = item.detalles ? `<br><small class="text-danger">${item.detalles}</small>` : '';
                
                tbody.innerHTML += `
                    <tr>
                        <td style="font-size: 0.85rem;">${item.nombre} ${textoDetallesHtml}</td>
                        <td>
                            <button class="btn btn-sm btn-outline-secondary py-0 px-1" onclick="cambiarCantidad('${item.itemUnicoId}', -1)">-</button>
                            <span class="mx-1">${item.cantidad}</span>
                            <button class="btn btn-sm btn-outline-secondary py-0 px-1" onclick="cambiarCantidad('${item.itemUnicoId}', 1)">+</button>
                        </td>
                        <td style="font-size: 0.85rem;">S/ ${subtotal.toFixed(2)}</td>
                        <td><button class="btn btn-danger btn-sm py-0 px-1" onclick="cambiarCantidad('${item.itemUnicoId}', -${item.cantidad})">&times;</button></td>
                    </tr>
                `;
            });
            spanTotal.innerText = `S/ ${total.toFixed(2)}`;
        }

        function enviarPedido() {
            if (carrito.length === 0) {
                alert("Agrega al menos un producto a tu pedido.");
                return;
            }
            const cliente = document.getElementById('nombre-cliente').value.trim();
            if (!cliente) {
                alert("Por favor ingresa tu número de mesa o nombre.");
                return;
            }

            const nuevoPedido = {
                id: Date.now(),
                cliente: cliente,
                items: [...carrito],
                total: document.getElementById('total-pagar').innerText,
                metodo: document.getElementById('metodo-pago').value,
                estado: "Pendiente"
            };

            let pedidos = JSON.parse(localStorage.getItem('pedidos_restaurante')) || [];
            pedidos.push(nuevoPedido);
            localStorage.setItem('pedidos_restaurante', JSON.stringify(pedidos));

            alert("¡Pedido enviado con éxito a la cocina de El Cártel!");
            carrito = [];
            document.getElementById('nombre-cliente').value = '';
            actualizarCarrito();
        }

        inicializarFiltros();
        actualizarCarrito();
        cargarMenu();
    </script>
</body>
</html>
