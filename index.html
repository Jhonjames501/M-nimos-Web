<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realiza tu Pedido - Restaurante</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container my-4">
        <h2 class="text-center mb-2">🍽️ Haz tu Pedido</h2>
        <p class="text-center text-muted mb-4">Selecciona tus platos y envíalos directamente a cocina</p>

        <div class="row">
            <!-- Menú para el cliente -->
            <div class="col-md-7 mb-4">
                <h4 class="mb-3">Nuestro Menú</h4>
                <div class="row" id="menu-productos"></div>
            </div>

            <!-- Resumen del pedido del cliente -->
            <div class="col-md-5">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h4 class="card-title mb-3">Tu Pedido</h4>
                        
                        <div class="mb-3">
                            <label class="form-label">Número de Mesa o Nombre:</label>
                            <input type="text" id="nombre-cliente" class="form-control" placeholder="Ej: Mesa 4 o Juan Pérez">
                        </div>

                        <div class="table-responsive" style="max-height: 200px; overflow-y: auto;">
                            <table class="table table-sm">
                                <thead>
                                    <tr>
                                        <th>Item</th>
                                        <th>Cant</th>
                                        <th>Subtotal</th>
                                        <th></th>
                                    </tr>
                                </thead>
                                <tbody id="lista-carrito"></tbody>
                            </table>
                        </div>

                        <hr>
                        <h5>Total: <span id="total-pagar" class="text-success fw-bold">S/ 0.00</span></h5>

                        <div class="mb-3 mt-3">
                            <label class="form-label">Método de Pago:</label>
                            <select id="metodo-pago" class="form-select">
                                <option value="Efectivo al recibir">Efectivo al recibir</option>
                                <option value="Yape / Plin">Yape / Plin</option>
                                <option value="Tarjeta POS">Tarjeta POS</option>
                            </select>
                        </div>

                        <div class="d-grid">
                            <button class="btn btn-success btn-lg" onclick="enviarPedido()">Enviar Pedido a Caja</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const productos = [
            { id: 1, nombre: "Pollo a la Brasa", precio: 65.00 },
            { id: 2, nombre: "Gaseosa 1.5L", precio: 10.00 },
            { id: 3, nombre: "Porción Papas", precio: 15.00 },
            { id: 4, nombre: "Chifa Aero", precio: 22.00 },
            { id: 5, nombre: "Lomo Saltado", precio: 28.00 }
        ];

        let carrito = [];

        function cargarMenu() {
            const contenedor = document.getElementById('menu-productos');
            contenedor.innerHTML = '';
            productos.forEach(prod => {
                contenedor.innerHTML += `
                    <div class="col-sm-6 mb-3">
                        <div class="card h-100 shadow-sm">
                            <div class="card-body d-flex flex-column justify-content-between">
                                <div>
                                    <h5 class="card-title fs-6">${prod.nombre}</h5>
                                    <p class="card-text text-muted fw-bold">S/ ${prod.precio.toFixed(2)}</p>
                                </div>
                                <button class="btn btn-primary btn-sm mt-2" onclick="agregarAlCarrito(${prod.id})">Agregar</button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function agregarAlCarrito(id) {
            const producto = productos.find(p => p.id === id);
            const itemEnCarrito = carrito.find(item => item.id === id);
            if (itemEnCarrito) {
                itemEnCarrito.cantidad++;
            } else {
                carrito.push({ ...producto, cantidad: 1 });
            }
            actualizarCarrito();
        }

        function cambiarCantidad(id, cambio) {
            const item = carrito.find(p => p.id === id);
            if (item) {
                item.cantidad += cambio;
                if (item.cantidad <= 0) {
                    carrito = carrito.filter(p => p.id !== id);
                }
            }
            actualizarCarrito();
        }

        function actualizarCarrito() {
            const tbody = document.getElementById('lista-carrito');
            const spanTotal = document.getElementById('total-pagar');
            tbody.innerHTML = '';
            let total = 0;

            carrito.forEach(item => {
                let subtotal = item.precio * item.cantidad;
                total += subtotal;
                tbody.innerHTML += `
                    <tr>
                        <td>${item.nombre}</td>
                        <td>
                            <button class="btn btn-xs btn-outline-secondary py-0 px-1" onclick="cambiarCantidad(${item.id}, -1)">-</button>
                            ${item.cantidad}
                            <button class="btn btn-xs btn-outline-secondary py-0 px-1" onclick="cambiarCantidad(${item.id}, 1)">+</button>
                        </td>
                        <td>S/ ${subtotal.toFixed(2)}</td>
                        <td><button class="btn btn-danger btn-sm py-0 px-1" onclick="cambiarCantidad(${item.id}, -${item.cantidad})">&times;</button></td>
                    </tr>
                `;
            });
            spanTotal.innerText = `S/ ${total.toFixed(2)}`;
        }

        function enviarPedido() {
            if (carrito.length === 0) {
                alert("Agrega al menos un producto a tu pedido.");
                return;
            }
            const cliente = document.getElementById('nombre-cliente').value.trim();
            if (!cliente) {
                alert("Por favor ingresa tu número de mesa o nombre.");
                return;
            }

            const nuevoPedido = {
                id: Date.now(),
                cliente: cliente,
                items: [...carrito],
                total: document.getElementById('total-pagar').innerText,
                metodo: document.getElementById('metodo-pago').value,
                estado: "Pendiente"
            };

            // Guardar en la base de datos local del navegador (para que la caja lo reciba)
            let pedidos = JSON.parse(localStorage.getItem('pedidos_restaurante')) || [];
            pedidos.push(nuevoPedido);
            localStorage.setItem('pedidos_restaurante', JSON.stringify(pedidos));

            alert("¡Pedido enviado con éxito a la cocina!");
            carrito = [];
            document.getElementById('nombre-cliente').value = '';
            actualizarCarrito();
        }

        cargarMenu();
    </script>
</body>
</html>
